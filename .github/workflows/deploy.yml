name: Deploy worker to Cloudflare

# Only a `crowd-v*` tag push may deploy. Branch pushes and workflow_dispatch
# do not trigger this workflow, and deploy.mjs independently refuses to run
# without the matching GITHUB_REF_TYPE/GITHUB_REF_NAME values.

on:
  push:
    tags:
      - 'crowd-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Verify tag matches the Worker version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/worker/package.json').version")
          expected="crowd-v$version"
          if [ "$REF_NAME" != "$expected" ]; then
            echo "::error::Tag $REF_NAME does not match packages/worker/package.json version $version (expected $expected)"
            exit 1
          fi

      # text-analyzer typechecks against @flaxia/node's emitted types, so all
      # workspaces must be built before the typecheck step below.
      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run workspace tests
        run: npm test --workspaces --if-present

      - name: Validate the Worker configuration
        run: npm run deploy:worker -- --dry-run

      # The Worker resolves D1-backed API keys, so the schema must exist before
      # the new code is deployed. This is idempotent: Wrangler records applied
      # migrations in d1_migrations and the SQL uses CREATE TABLE IF NOT EXISTS,
      # so re-running it on every tag deploy is safe. Run from packages/worker
      # so Wrangler finds wrangler.toml and its migrations_dir binding.
      - name: Apply D1 migrations
        working-directory: packages/worker
        run: npx wrangler d1 migrations apply flaxia-crowd-keys --remote

      - name: Deploy the Worker
        run: npm run deploy:worker
