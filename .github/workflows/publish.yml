name: Publish @flaxia packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'node'
        type: choice
        options:
          - node
          - sdk
  push:
    tags:
      - 'node-v*'
      - 'sdk-v*'

jobs:
  verify-vendoring:
    # Tag pushes do not trigger ci.yml, so re-check here that the vendored wasm
    # is built from the exact FriedFlaxia commit recorded in the manifest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Read the pinned FriedFlaxia commit
        id: pin
        run: |
          echo "commit=$(node -p "require('./packages/node/src/vendor/friedflaxia/manifest.json').sourceCommit")" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned FriedFlaxia source
        uses: actions/checkout@v4
        with:
          repository: TeamFlaxia/friedflaxia
          ref: ${{ steps.pin.outputs.commit }}
          path: friedflaxia
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify the vendored wasm matches the pinned source
        env:
          FRIEDFLAXIA_DIR: ${{ github.workspace }}/friedflaxia
        run: npm run check:friedflaxia

  publish:
    needs: verify-vendoring
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g npm@latest

      - name: Build SDK
        run: npm run build --workspace=packages/sdk

      - name: Publish SDK
        if: startsWith(github.ref, 'refs/tags/sdk-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'sdk')
        working-directory: packages/sdk
        run: npm publish --provenance --access public

      - name: Build node
        if: startsWith(github.ref, 'refs/tags/node-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'node')
        run: npm run build --workspace=packages/node

      - name: Publish node
        if: startsWith(github.ref, 'refs/tags/node-v') || (github.event_name == 'workflow_dispatch' && inputs.package == 'node')
        working-directory: packages/node
        run: npm publish --provenance --access public
