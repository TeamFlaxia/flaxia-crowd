name: Inference benchmark contract

on:
  pull_request:
    paths:
      - 'scripts/benchmarks/**'
      - 'scripts/swarm-spike/run-synth.mjs'
      - 'benchmarks/inference/**'
      - '.github/workflows/inference-benchmark-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'scripts/benchmarks/**'
      - 'scripts/swarm-spike/run-synth.mjs'
      - 'benchmarks/inference/**'
      - '.github/workflows/inference-benchmark-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run test:benchmarks
