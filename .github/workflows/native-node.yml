name: Native node

on:
  push:
    branches: [main, develop]
  # Also validate stacked pull requests against feature branches.
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/node-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/node-native
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install SDK and worker test dependencies
        working-directory: .
        run: npm ci
      - name: Build SDK
        working-directory: .
        run: npm run build --workspace=@flaxia/sdk
      - name: SDK to real worker to native node
        working-directory: .
        run: node --test packages/node-native/tests/worker-e2e.mjs
