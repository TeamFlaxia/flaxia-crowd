name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        # @flaxia/node resolves its types from dist/, so it has to be built
        # before @flaxia/text-analyzer typechecks, and dependents import
        # runtime values from @flaxia/sdk.
        run: npm run build

      - name: Type check
        # `npm test` only runs the suites, so without this step type errors in
        # packages that do not emit during their build (worker) are never seen.
        run: npm run typecheck

      - name: Run tests
        run: npm test --workspaces --if-present
