name: CI

on:
  push:
    branches: [main, develop]
  # Also validate stacked pull requests against feature branches.
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Reject committed live API keys
        shell: bash
        run: |
          # Documentation and tests legitimately show placeholders such as
          # `fc_live_xxxxxxxxxxxx`, so only flag values that do not look like a
          # placeholder. The workflow file itself is excluded because it has to
          # name the very patterns it rejects.
          placeholder='fc_live_(x{4,}|X{4,}|your|example|sample|test|dummy|fake|placeholder|redacted|\.\.\.|<|\$\{)'
          if git grep -n -E 'fc_live_[A-Za-z0-9_-]+' -- ':!package-lock.json' ':!.github/workflows/ci.yml' \
              | grep -v -E "$placeholder"; then
            echo "::error::Live-looking Crowd API key committed to the repository"
            exit 1
          fi
          if git grep -n 'VITE_FLAXIA_API_KEY' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Crowd API keys must not be exposed through VITE_* variables"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        # @flaxia/node resolves its types from dist/, so it has to be built
        # before @flaxia/text-analyzer typechecks, and dependents import
        # runtime values from @flaxia/sdk.
        run: npm run build

      - name: Verify the wasm assets are not inlined
        run: node --test scripts/dist-wasm.test.mjs

      - name: Type check
        # `npm test` only runs the suites, so without this step type errors in
        # packages that do not emit during their build (worker) are never seen.
        run: npm run typecheck

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Shared Qwen3.5-2B generation baseline contracts
        run: node --test scripts/swarm-spike/generation-baseline.test.mjs scripts/swarm-spike/real-options.test.mjs scripts/swarm-spike/prepare-generation-model.test.mjs

  friedflaxia-vendoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Read the pinned FriedFlaxia commit
        id: pin
        run: |
          echo "commit=$(node -p "require('./packages/node/src/vendor/friedflaxia/manifest.json').sourceCommit")" >> "$GITHUB_OUTPUT"
      - name: Checkout the pinned FriedFlaxia source
        uses: actions/checkout@v4
        with:
          repository: TeamFlaxia/friedflaxia
          ref: ${{ steps.pin.outputs.commit }}
          path: friedflaxia
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Add the wasm target to the pinned toolchain
        run: |
          cd friedflaxia
          rustup target add wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Verify the vendored wasm matches the pinned source
        env:
          FRIEDFLAXIA_DIR: ${{ github.workspace }}/friedflaxia
        run: npm run check:friedflaxia
      - name: Verify the manifest contract and instantiate the vendored wasm
        run: node --test scripts/sync-friedflaxia.test.mjs scripts/friedflaxia-wasm-smoke.test.mjs

  video-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm install --prefix "$RUNNER_TEMP/flaxia-browser-tools" --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Bundle the video decoder for the browser
        run: |
          mkdir -p dist-video
          npx esbuild packages/node/src/workloads/friedflaxia/video-decoder.ts \
            --bundle --format=esm --platform=browser --target=es2022 \
            --outfile=dist-video/video.js
      - name: Decode an MP4 with real WebCodecs
        run: node scripts/video-smoke.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          CHROME: /usr/bin/google-chrome

  wasm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/flaxia-browser-tools" --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Instantiate the SIMD and baseline wasm in Chrome
        run: node scripts/wasm-smoke.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/flaxia-browser-tools/node_modules/playwright/index.mjs
          CHROME: /usr/bin/google-chrome
