name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Reject committed live API keys
        shell: bash
        run: |
          # Documentation and tests legitimately show placeholders such as
          # `fc_live_xxxxxxxxxxxx`, so only flag values that do not look like a
          # placeholder. The workflow file itself is excluded because it has to
          # name the very patterns it rejects.
          placeholder='fc_live_(x{4,}|X{4,}|your|example|sample|test|dummy|fake|placeholder|redacted|\.\.\.|<|\$\{)'
          if git grep -n -E 'fc_live_[A-Za-z0-9_-]+' -- ':!package-lock.json' ':!.github/workflows/ci.yml' \
              | grep -v -E "$placeholder"; then
            echo "::error::Live-looking Crowd API key committed to the repository"
            exit 1
          fi
          if git grep -n 'VITE_FLAXIA_API_KEY' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Crowd API keys must not be exposed through VITE_* variables"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        # @flaxia/node resolves its types from dist/, so it has to be built
        # before @flaxia/text-analyzer typechecks, and dependents import
        # runtime values from @flaxia/sdk.
        run: npm run build

      - name: Type check
        # `npm test` only runs the suites, so without this step type errors in
        # packages that do not emit during their build (worker) are never seen.
        run: npm run typecheck

      - name: Run tests
        run: npm test --workspaces --if-present
