name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        # @flaxia/node and @flaxia/worker import runtime values from
        # @flaxia/sdk, so its dist/ must exist before their tests run.
        run: npm run build --workspace=packages/sdk

      - name: Run tests
        run: npm test --workspaces --if-present

      - name: Build packages
        run: npm run build
