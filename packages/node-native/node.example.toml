# Copy to node.toml and explicitly opt in before starting.
orchestrator_url = "http://127.0.0.1:8787"
site_id = "native-dev"
participate = false

# Linux: explicitly enable execution after opting in above.
[execution]
image_process = false
memory_limit_mb = 512
max_timeout_ms = 120000

# Optional Vulkan Swarm. Requires Linux, Deno 2.9.6 and a Vulkan driver.
# Build the helper with: node packages/node-native/swarm/build.mjs
[execution.swarm]
enabled = false
allow_model_download = false
# Replace these with trusted absolute local paths before enabling.
runtime = "/opt/deno/bin/deno"
helper = "/opt/flaxia-crowd/packages/node-native/dist/swarm-helper.js"
# V8 heap only; GPU/driver/native memory is not included.
heap_limit_mb = 512
