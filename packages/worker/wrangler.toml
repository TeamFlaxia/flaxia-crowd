name = "flaxia-worker"
main = "src/index.ts"
compatibility_date = "2024-04-03"

[vars]
CORS_ORIGINS = "http://localhost:5173,http://localhost:5174,http://localhost:8787,https://flaxia.app,https://*.flaxia.app"
RATE_LIMIT_MAX = "100"
MAX_PAYLOAD_SIZE = "1048576"

# Secrets must never be committed here. Configure production values with:
#   wrangler secret put API_KEYS                 # task API keys (key or key:tenant)
#   wrangler secret put NODE_TOKEN_SECRET        # signs node registration tokens
#   wrangler secret put SUBSCRIBE_TOKEN_SECRET   # signs /crowd/subscribe tokens
#   wrangler secret put WEBHOOK_SIGNING_SECRET   # signs webhook deliveries
# Keep the three signing secrets distinct so one leak cannot forge the others.
# Use .dev.vars for local development (the file is gitignored); see
# .dev.vars.example. Without API_KEYS, task submission/polling fails closed
# with 401; without NODE_TOKEN_SECRET or SUBSCRIBE_TOKEN_SECRET, registration
# and subscription return 503; without WEBHOOK_SIGNING_SECRET, tasks with a
# callbackUrl are rejected with 400.

[[d1_databases]]
binding = "DB"
database_name = "flaxia-crowd-keys"
database_id = "9ef5f678-2e15-4026-aa57-4e4f9659efcc"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["Coordinator"]
